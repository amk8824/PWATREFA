<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<!-- شاشة كاملة بدون بياض -->
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>الحاسبة الكمركية الذكية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<!-- لون شريط النظام -->
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* ===== ROOT ===== */
:root{
  --bg:#0b0f14;
  --surface:#141a22;
  --card:#1b2330;
  --primary:#1fd18b;
  --accent:#f5c86a;
  --text:#ffffff;
  --muted:#a0a7b4;
  --border:#2a3444;
  --shadow:0 18px 40px rgba(0,0,0,.55);
}

/* ===== RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Cairo',sans-serif;
  font-weight:800;
}

/* منع السحب */
html,body{
  height:100%;
  width:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:var(--bg);
}

/* إزالة أسهم الأرقام */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
  -webkit-appearance:none;
}
input[type=number]{ -moz-appearance:textfield; }

/* ===== APP ===== */
.app{
  height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

/* ===== HEADER ===== */
.header{
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.header img{
  height:36px;
}
.header-center{
  text-align:center;
  flex:1;
}
.header-center h1{
  font-size:17px;
}
.header-center span{
  font-size:11px;
  color:var(--muted);
}

/* ===== CONTENT ===== */
.content{
  flex:1;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* ===== CARD ===== */
.card{
  background:linear-gradient(180deg,var(--card),#151b24);
  border-radius:20px;
  padding:14px;
  box-shadow:var(--shadow);
}

/* ===== GRID ===== */
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field label{
  font-size:11px;
  color:var(--muted);
  margin-bottom:4px;
  display:block;
}
.field input{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:2px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:14px;
}
.field input:focus{
  outline:none;
  border-color:var(--primary);
}

/* ===== TOGGLE ===== */
.toggle{
  grid-column:1/3;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--muted);
}

/* ===== BUTTON ===== */
button.calc{
  grid-column:1/3;
  padding:14px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,var(--primary),#19b77b);
  color:#08140f;
  font-size:16px;
  font-weight:900;
}

/* ===== RESULT ===== */
.result{
  background:linear-gradient(160deg,#0e3f2a,#062718);
  border-radius:20px;
  padding:16px;
}
.result-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:6px;
  color:#d1fae5;
}
.result h2{
  margin-top:8px;
  text-align:center;
  font-size:22px;
  color:var(--accent);
}

/* ===== DESIGNER ===== */
.designer{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  padding:8px 0;
}
.designer strong{
  color:var(--primary);
}

.hidden{display:none}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <img src="https://www2.0zz0.com/2025/05/19/22/510831948.png">
    <div class="header-center">
      <h1>الحاسبة الكمركية الذكية</h1>
      <span>جمهورية العراق – الهيئة العامة للكمارك</span>
    </div>
    <img src="https://www2.0zz0.com/2025/05/19/22/823371779.png">
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="card">
      <div class="form-grid">
        <div class="field"><label>سعر الطن</label><input id="pricePerTon" type="number"></div>
        <div class="field"><label>عدد الأطنان</label><input id="tons" type="number"></div>
        <div class="field"><label>سعر الصرف</label><input id="rate" type="number"></div>
        <div class="field"><label>الضريبة الكمركية %</label><input id="customTax" type="number"></div>
        <div class="field"><label>الضريبة %</label><input id="generalTax" type="number"></div>
        <div class="field hidden" id="protectBox"><label>الحماية %</label><input id="protectTax" type="number"></div>

        <div class="toggle">
          <input type="checkbox" id="protectToggle">
          <label>تفعيل رسم الحماية</label>
        </div>

        <button class="calc" onclick="calculate()">احسب</button>
      </div>
    </div>

    <div class="result">
      <div class="result-row"><span>السعر الأساسي</span><span id="baseOut">—</span></div>
      <div class="result-row"><span>إجمالي الضرائب</span><span id="taxOut">—</span></div>
      <h2 id="totalOut">— IQD</h2>
    </div>

    <div class="designer">
      تم التصميم والبرمجة بواسطة<br>
      <strong>احمد عبد القادر مشحن العبيدي</strong>
    </div>

  </div>
</div>

<script>
protectToggle.onchange=()=>protectBox.classList.toggle("hidden",!protectToggle.checked);

function formatIQD(n){return n.toLocaleString("en-US")+" IQD";}
function calculate(){
  if(navigator.vibrate) navigator.vibrate(50);
  const base=(+pricePerTon.value||0)*(+tons.value||0)*(+rate.value||0);
  const taxes=base*((+customTax.value||0)+(+generalTax.value||0)+(protectToggle.checked?(+protectTax.value||0):0))/100;
  baseOut.textContent=formatIQD(base);
  taxOut.textContent=formatIQD(taxes);
  totalOut.textContent=formatIQD(base+taxes);
}
</script>

</body>
</html>
