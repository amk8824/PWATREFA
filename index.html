<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>الحاسبة الكمركية الذكية</title>

<!-- ================= PWA ================= -->
<link rel="manifest" href="manifest.json">

<!-- Android icons -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- iOS icon (الأهم) -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">

<meta name="theme-color" content="#0a0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<!-- ======================================= -->

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0f1c;
  --panel:#121a2a;
  --card:#182338;
  --primary:#22d39a;
  --accent:#f7d774;
  --text:#ffffff;
  --muted:#9aa6c3;
}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{appearance:textfield;}

html,body{
  margin:0;
  height:100%;
  background:var(--bg);
  color:var(--text);
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.hero{
  padding:18px;
  background:linear-gradient(135deg,#22d39a55,transparent);
  text-align:center;
}
.hero h1{margin:0;font-size:22px;font-weight:900;}
.hero p{margin:4px 0 0;font-size:12px;color:var(--muted);}

.content{
  flex:1;
  padding:16px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.input{
  background:var(--card);
  padding:14px;
  border-radius:16px;
}
.input label{
  font-size:14px;
  color:var(--accent);
  font-weight:900;
}
.input input{
  width:100%;
  background:none;
  border:none;
  border-bottom:2px solid #2b3754;
  color:#fff;
  font-size:16px;
}

.action{
  padding:16px;
}
button{
  width:100%;
  padding:18px;
  border:none;
  border-radius:20px;
  background:linear-gradient(135deg,var(--primary),#18bfa0);
  font-size:18px;
  font-weight:900;
}

.result{
  position:fixed;
  bottom:0;left:0;right:0;
  background:#07261e;
  padding:20px;
  display:none;
  border-radius:24px 24px 0 0;
}
.result div{display:flex;justify-content:space-between;margin-bottom:6px;}
.result h2{text-align:center;color:var(--accent);}

footer{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  padding:10px;
}
footer strong{color:var(--primary);}
</style>
</head>

<body>

<div class="app">

  <div class="hero">
    <h1>الحاسبة الكمركية الذكية</h1>
    <p>الهيئة العامة للكمارك</p>
  </div>

  <div class="content">
    <div class="input"><label>سعر الطن</label><input id="a" type="number"></div>
    <div class="input"><label>عدد الأطنان</label><input id="b" type="number"></div>
    <div class="input"><label>الضريبة الكمركية %</label><input id="d" type="number"></div>
    <div class="input"><label>الضريبة %</label><input id="e" type="number"></div>
    <div class="input"><label>حماية المنتج الوطني %</label><input id="np" type="number"></div>
  </div>

  <div class="action">
    <button onclick="calc()">احتساب</button>
  </div>

  <footer>
    تم التصميم والبرمجة بواسطة<br>
    <strong>احمد عبد القادر مشحن العبيدي</strong>
  </footer>

</div>

<div class="result" id="r">
  <div><span>السعر الأساسي</span><span id="rb"></span></div>
  <div><span>إجمالي الضرائب</span><span id="rt"></span></div>
  <h2 id="rf"></h2>
  <button onclick="resetCalc()">حساب جديد</button>
</div>

<script>
function f(n){return n.toLocaleString("en-US")+" IQD";}
function calc(){
  const base=(+a.value||0)*(+b.value||0)*1320;
  const tax=base*((+d.value||0)+(+e.value||0)+(+np.value||0))/100;
  rb.textContent=f(base);
  rt.textContent=f(tax);
  rf.textContent=f(base+tax);
  r.style.display="block";
}
function resetCalc(){
  r.style.display="none";
  a.value=b.value=d.value=e.value=np.value="";
}
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
