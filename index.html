<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Autonomous Customs System</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0d12;
  --panel:#11151c;
  --line:#1f2633;
  --accent:#00e5ff;
  --text:#ffffff;
  --muted:#7d8799;
}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
}
.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding:20px 16px 220px;
}
.header h1{margin:0;font-size:24px;}
.header span{font-size:12px;color:var(--muted);}
.panel{
  margin-top:24px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
}
.field{margin-bottom:20px;}
.field label{font-size:12px;color:var(--muted);}
.field input{
  width:100%;
  background:none;
  border:none;
  border-bottom:1px solid var(--line);
  padding:10px 0;
  font-size:18px;
  color:#fff;
}
.field input:focus{outline:none;border-bottom-color:var(--accent);}
.field input[readonly]{color:var(--accent);font-weight:700;border-bottom-style:dashed;}
.footer{
  position:fixed;
  left:0;right:0;
  bottom:132px;
  text-align:center;
  font-size:11px;
  color:var(--muted);
}
.footer b{color:var(--accent);}
.action{
  position:fixed;
  left:0;right:0;
  bottom:20px;
  padding:16px;
}
button{
  width:100%;
  padding:18px;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
  background:var(--accent);
  color:#001318;
}
.result{
  position:fixed;
  left:0;right:0;
  bottom:86px;
  background:#0f1724;
  border-top:1px solid var(--line);
  padding:18px;
  display:none;
}
.result-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
}
.result h2{
  text-align:center;
  color:var(--accent);
}
</style>
</head>

<body>

<div class="app">
  <div class="header">
    <h1>AUTONOMOUS CUSTOMS</h1>
    <span>Government Smart System</span>
  </div>

  <div class="panel">
    <div class="field"><label>سعر الطن</label><input id="a" type="number"></div>
    <div class="field"><label>عدد الأطنان</label><input id="b" type="number"></div>
    <div class="field"><label>سعر الصرف</label><input id="c" type="number" value="1320" readonly></div>
    <div class="field"><label>الرسوم %</label><input id="d" type="number"></div>
    <div class="field"><label>ضريبة إضافية %</label><input id="e" type="number"></div>
  </div>
</div>

<div class="result" id="r">
  <div class="result-row"><span>الأساس</span><span id="rb"></span></div>
  <div class="result-row"><span>الضرائب</span><span id="rt"></span></div>
  <h2 id="rf"></h2>
</div>

<div class="footer">
  Designed by <b>Ahmed Abdulqader Al-Obaidi</b>
</div>

<div class="action">
  <button onclick="calc()">RUN</button>
</div>

<script>
function f(n){return n.toLocaleString("en-US")+" IQD";}
function calc(){
  const base=(+a.value||0)*(+b.value||0)*1320;
  const tax=base*((+d.value||0)+(+e.value||0))/100;
  r.style.display="block";
  rb.textContent=f(base);
  rt.textContent=f(tax);
  rf.textContent=f(base+tax);
}
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
