<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>الحاسبة الكمركية الذكية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#f3f5f4;
    --card:#ffffff;
    --primary:#0b5d3b;
    --text:#222;
    --sub:#666;
}

/* DARK MODE */
body.dark{
    --bg:#0f1113;
    --card:#1b1f23;
    --primary:#1f8f5f;
    --text:#ffffff;
    --sub:#aaaaaa;
}

*{
    box-sizing:border-box;
    font-family:'Cairo', sans-serif;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden; /* لا سحب */
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* HEADER */
.header{
    background:var(--primary);
    color:#fff;
    padding:12px;
    text-align:center;
    position:relative;
}
.header h1{
    margin:0;
    font-size:15px;
    color:#f0c85a;
}
.header span{
    font-size:11px;
    opacity:.9;
}

/* THEME TOGGLE */
.theme-btn{
    position:absolute;
    left:10px;
    top:10px;
    background:none;
    border:none;
    color:#fff;
    font-size:18px;
}

/* CONTENT */
.content{
    flex:1;
    padding:10px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

/* CARD */
.card{
    background:var(--card);
    border-radius:12px;
    padding:12px;
}

/* FORM */
.field{
    margin-bottom:8px;
}
.field label{
    font-size:11px;
    color:var(--sub);
}
.field input{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:14px;
}

/* TOGGLE */
.toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    margin-bottom:6px;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    color:#fff;
    font-size:15px;
}

/* RESULT BAR */
.result{
    background:var(--primary);
    color:#fff;
    border-radius:14px 14px 0 0;
    padding:14px;
}
.result h3{
    margin:6px 0;
    font-size:22px;
    text-align:center;
}
.result div{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    opacity:.95;
}

.hidden{display:none}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <button class="theme-btn" onclick="toggleTheme()">🌙</button>
        <h1>الحاسبة الكمركية الذكية</h1>
        <span>جمهورية العراق – الهيئة العامة للكمارك</span>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <!-- FORM -->
        <div class="card">
            <div class="field">
                <label>سعر الطن (USD)</label>
                <input id="usd" type="number" value="1000">
            </div>

            <div class="field">
                <label>سعر الصرف (IQD)</label>
                <input id="rate" type="number" value="1320">
            </div>

            <div class="field">
                <label>الضريبة الكمركية (%)</label>
                <input id="customTax" type="number" value="15">
            </div>

            <div class="field">
                <label>الضريبة (%)</label>
                <input id="generalTax" type="number" value="5">
            </div>

            <div class="toggle">
                <input type="checkbox" id="protectToggle">
                <label>رسم الحماية</label>
            </div>

            <div class="field hidden" id="protectBox">
                <label>نسبة الحماية (%)</label>
                <input id="protect" type="number">
            </div>

            <button onclick="calc()">تنفيذ الحساب</button>
        </div>

        <!-- RESULT -->
        <div class="result">
            <div><span>السعر الأساسي</span><span id="base">0</span></div>
            <div><span>الضرائب</span><span id="taxes">0</span></div>
            <h3 id="total">0 IQD</h3>
        </div>

    </div>

</div>

<script>
const toggle=document.getElementById("protectToggle");
const box=document.getElementById("protectBox");

toggle.onchange=()=>box.classList.toggle("hidden",!toggle.checked);

function f(n){return n.toLocaleString("en-US")+" IQD"}

function calc(){
    const u=+usd.value||0;
    const r=+rate.value||0;
    const c=+customTax.value||0;
    const g=+generalTax.value||0;
    const p=toggle.checked?(+protect.value||0):0;

    const baseVal=u*r;
    const taxesVal=baseVal*(c+g+p)/100;
    const totalVal=baseVal+taxesVal;

    base.innerText=f(baseVal);
    taxes.innerText=f(taxesVal);
    total.innerText=f(totalVal);
}

function toggleTheme(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
