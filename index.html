<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحاسبة الكمركية الذكية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<style>
/* =======================
   PREMIUM DESIGN SYSTEM
   ======================= */
:root{
  --bg:#0b0f14;
  --surface:#141a22;
  --card:#1b2330;
  --primary:#1fd18b;
  --secondary:#0b5d3b;
  --accent:#f5c86a;
  --text:#ffffff;
  --muted:#a0a7b4;
  --border:#2a3444;
  --shadow:0 20px 50px rgba(0,0,0,.6);
}

/* =======================
   GLOBAL
   ======================= */
*{
  box-sizing:border-box;
  font-family:'Cairo',sans-serif;
  font-weight:800;
}

/* إزالة أسهم الزيادة/النقصان */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}
input[type=number]{
  -moz-appearance:textfield;
}

body{
  margin:0;
  background:radial-gradient(circle at top,#0f172a,#0b0f14);
  color:var(--text);
}

/* =======================
   APP
   ======================= */
.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* =======================
   HEADER WITH LOGOS
   ======================= */
.header{
  padding:18px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header img{
  height:46px;
  object-fit:contain;
}

.header-center{
  text-align:center;
  flex:1;
}
.header-center h1{
  margin:0;
  font-size:20px;
}
.header-center span{
  font-size:13px;
  color:var(--muted);
}

/* =======================
   CONTENT
   ======================= */
.content{
  flex:1;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:22px;
}

/* =======================
   CARD
   ======================= */
.card{
  background:linear-gradient(180deg,var(--card),#151b24);
  border-radius:26px;
  padding:22px;
  box-shadow:var(--shadow);
}

/* =======================
   FORM GRID
   ======================= */
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field label{
  font-size:14px;
  color:var(--muted);
  margin-bottom:8px;
  display:block;
}

.field input{
  width:100%;
  padding:18px;
  border-radius:18px;
  border:2px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:18px;
}

.field input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(31,209,139,.25);
}

/* =======================
   TOGGLE
   ======================= */
.toggle{
  grid-column:1/3;
  display:flex;
  align-items:center;
  gap:12px;
  font-size:16px;
  color:var(--muted);
}

/* =======================
   BUTTON
   ======================= */
button.calc{
  grid-column:1/3;
  margin-top:10px;
  padding:20px;
  border:none;
  border-radius:22px;
  background:linear-gradient(135deg,var(--primary),#19b77b);
  color:#08140f;
  font-size:20px;
  font-weight:900;
  box-shadow:0 12px 30px rgba(31,209,139,.45);
}

/* =======================
   RESULT
   ======================= */
.result{
  background:linear-gradient(160deg,#0e3f2a,#062718);
  border-radius:28px;
  padding:26px;
  box-shadow:var(--shadow);
}

.result-row{
  display:flex;
  justify-content:space-between;
  font-size:17px;
  margin-bottom:12px;
  color:#d1fae5;
}

.result h2{
  margin:16px 0 0;
  text-align:center;
  font-size:34px;
  color:var(--accent);
}

/* =======================
   DESIGNER
   ======================= */
.designer{
  margin-top:30px;
  text-align:center;
  font-size:14px;
  color:var(--muted);
  line-height:1.9;
  padding-bottom:30px;
}
.designer strong{
  color:var(--primary);
}

.hidden{display:none}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <img src="https://www2.0zz0.com/2025/05/19/22/510831948.png" alt="Logo Right">
    
    <div class="header-center">
      <h1>الحاسبة الكمركية الذكية</h1>
      <span>جمهورية العراق – الهيئة العامة للكمارك</span>
    </div>

    <img src="https://www2.0zz0.com/2025/05/19/22/823371779.png" alt="Logo Left">
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- FORM -->
    <div class="card">
      <div class="form-grid">

        <div class="field">
          <label>سعر الطن (USD)</label>
          <input id="pricePerTon" type="number" placeholder="أدخل السعر">
        </div>

        <div class="field">
          <label>عدد الأطنان</label>
          <input id="tons" type="number" placeholder="أدخل العدد">
        </div>

        <div class="field">
          <label>سعر الصرف (IQD)</label>
          <input id="rate" type="number" placeholder="أدخل السعر">
        </div>

        <div class="field">
          <label>الضريبة الكمركية (%)</label>
          <input id="customTax" type="number" placeholder="%">
        </div>

        <div class="field">
          <label>الضريبة (%)</label>
          <input id="generalTax" type="number" placeholder="%">
        </div>

        <div class="field hidden" id="protectBox">
          <label>نسبة الحماية (%)</label>
          <input id="protectTax" type="number" placeholder="%">
        </div>

        <div class="toggle">
          <input type="checkbox" id="protectToggle">
          <label>تفعيل رسم الحماية</label>
        </div>

        <button class="calc" onclick="calculate()">احسب الآن</button>

      </div>
    </div>

    <!-- RESULT -->
    <div class="result">
      <div class="result-row">
        <span>السعر الأساسي</span>
        <span id="baseOut">—</span>
      </div>
      <div class="result-row">
        <span>إجمالي الضرائب</span>
        <span id="taxOut">—</span>
      </div>
      <h2 id="totalOut">— IQD</h2>
    </div>

    <!-- DESIGNER -->
    <div class="designer">
      تم تصميم وبرمجة البرنامج بواسطة:<br>
      <strong>احمد عبد القادر مشحن العبيدي</strong><br>
      Email: alobaidymo@gmail.com | Whatsapp: +9647768525871
    </div>

  </div>

</div>

<script>
const protectToggle = document.getElementById("protectToggle");
const protectBox = document.getElementById("protectBox");

protectToggle.onchange = ()=>{
  protectBox.classList.toggle("hidden", !protectToggle.checked);
};

function formatIQD(n){
  return n.toLocaleString("en-US")+" IQD";
}

function vibrate(){
  if(navigator.vibrate) navigator.vibrate(80);
}

function calculate(){
  vibrate();

  const price = +pricePerTon.value || 0;
  const tonsVal = +tons.value || 0;
  const rateVal = +rate.value || 0;
  const custom = +customTax.value || 0;
  const general = +generalTax.value || 0;
  const protect = protectToggle.checked ? (+protectTax.value || 0) : 0;

  const base = price * tonsVal * rateVal;
  const taxes = base * (custom + general + protect) / 100;
  const total = base + taxes;

  baseOut.innerText = formatIQD(base);
  taxOut.innerText = formatIQD(taxes);
  totalOut.innerText = formatIQD(total);
}
</script>

</body>
</html>
