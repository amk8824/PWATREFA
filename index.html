<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>الحاسبة الكمركية الذكية</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">

<style>
/* ===== كودك الأصلي بدون أي تغيير ===== */
:root{
  --bg:#0a0f1c;
  --glass:rgba(255,255,255,0.06);
  --panel:#121a2a;
  --card:#182338;
  --primary:#22d39a;
  --accent:#f7d774;
  --text:#ffffff;
  --muted:#9aa6c3;
  --border:rgba(255,255,255,0.12);
}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{appearance:textfield;}
html,body{margin:0;height:100%;background:#0a0f1c;color:var(--text);}
body{min-height:100vh;min-height:100dvh;overflow:hidden;}
body::after{
  content:"";position:fixed;left:0;right:0;bottom:0;
  height:env(safe-area-inset-bottom);background:#0a0f1c;z-index:-1;
}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.hero{padding:20px 18px 16px;
  background:linear-gradient(135deg,rgba(34,211,154,0.25),transparent 40%),
             linear-gradient(225deg,rgba(247,215,116,0.18),transparent 45%);
  border-bottom:1px solid var(--border);}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.logo{height:42px;}
.hero-center{text-align:center;flex:1;}
.hero-center h1{margin:0;font-size:21px;font-weight:900;}
.hero-center p{margin:4px 0 0;font-size:12px;color:var(--muted);}
.content{flex:1;padding:16px;padding-bottom:140px;display:flex;flex-direction:column;gap:16px;}
.panel{background:var(--glass);backdrop-filter:blur(14px);
  border:1px solid var(--border);border-radius:24px;padding:18px;
  display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.input{background:linear-gradient(180deg,var(--card),#131c2e);
  border-radius:20px;padding:16px;}
.input label{font-size:14px;font-weight:900;color:var(--accent);}
.input input{width:100%;background:none;border:none;
  border-bottom:2px solid #2b3754;color:#fff;font-size:17px;}
.action{margin-top:auto;}
button{width:100%;padding:20px;font-size:19px;font-weight:900;
  border:none;border-radius:24px;
  background:linear-gradient(135deg,var(--primary),#18bfa0);}
.designer-logo{text-align:center;margin-top:18px;}
.designer-logo img{height:72px;}
.result{position:fixed;left:0;right:0;bottom:0;
  background:linear-gradient(160deg,#0f3f31,#07261e);
  padding:22px calc(18px + env(safe-area-inset-bottom));
  display:none;z-index:20;
  border-top-left-radius:26px;border-top-right-radius:26px;}
.result-row{display:flex;justify-content:space-between;font-size:16px;margin-bottom:8px;}
.result h2{text-align:center;font-size:28px;color:var(--accent);margin-top:12px;}
.recalc{margin-top:16px;}
.recalc button{background:rgba(255,255,255,0.15);color:#fff;}

/* ===== إضافة الحماية فقط (مستقلة تمامًا) ===== */
.lock-overlay{
  position:fixed;
  inset:0;
  background:rgba(10,15,28,0.96);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999999;
}
.lock-box{
  background:#121a2a;
  padding:26px;
  border-radius:22px;
  width:90%;
  max-width:340px;
  text-align:center;
}
.lock-box h2{
  margin:0 0 8px;
  color:var(--accent);
}
.lock-box p{
  font-size:13px;
  color:var(--muted);
  margin-bottom:14px;
}
.lock-box input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:18px;
  text-align:center;
}
.lock-box button{
  width:100%;
  margin-top:14px;
  padding:14px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,var(--primary),#18bfa0);
  font-size:17px;
  font-weight:900;
}
.lock-logo{margin-top:16px;}
.lock-logo img{height:60px;}
</style>
</head>

<body>

<!-- 🔒 شاشة القفل (إضافة فقط) -->
<div class="lock-overlay" id="lock">
  <div class="lock-box">
    <h2>تفعيل التطبيق</h2>
    <p>أدخل رمز يبدأ بحرف A</p>
    <input id="code" placeholder="A123">
    <button onclick="unlock()">دخول</button>
    <div class="lock-logo">
      <img src="https://up6.cc/2026/01/176978719559611.png">
    </div>
  </div>
</div>

<!-- ===== تطبيقك الأصلي بدون أي تغيير ===== -->
<div class="app">
  <div class="hero">
    <div class="hero-top">
      <img src="https://www2.0zz0.com/2025/05/19/22/510831948.png" class="logo">
      <div class="hero-center">
        <h1>الحاسبة الكمركية الذكية</h1>
        <p>الهيئة العامة للكمارك</p>
      </div>
      <img src="https://www2.0zz0.com/2025/05/19/22/823371779.png" class="logo">
    </div>
  </div>

  <div class="content">
    <div class="panel">
      <div class="input"><label>سعر الطن</label><input id="a" type="number"></div>
      <div class="input"><label>عدد الأطنان</label><input id="b" type="number"></div>
      <div class="input"><label>سعر الصرف</label><input type="number" value="1320" readonly></div>
      <div class="input"><label>الضريبة الكمركية %</label><input id="d" type="number"></div>
      <div class="input"><label>الضريبة %</label><input id="e" type="number"></div>
      <div class="input"><label>حماية المنتج الوطني % (اختياري)</label><input id="np" type="number"></div>
    </div>

    <div class="action">
      <button onclick="calc()">احتساب</button>
    </div>

    <div class="designer-logo">
      <img src="https://up6.cc/2026/01/176978719559611.png">
    </div>
  </div>
</div>

<div class="result" id="r">
  <div class="result-row"><span>السعر الأساسي</span><span id="rb"></span></div>
  <div class="result-row"><span>إجمالي الضرائب</span><span id="rt"></span></div>
  <h2 id="rf"></h2>
  <div class="recalc">
    <button onclick="resetCalc()">حساب جديد</button>
  </div>
</div>

<script>
/* ===== إضافة الحماية فقط ===== */
function unlock(){
  const v = document.getElementById("code").value.trim();
  if(v && v[0].toUpperCase()==="A"){
    document.getElementById("lock").style.display="none";
  }else{
    alert("الرمز غير صحيح – يجب أن يبدأ بحرف A");
  }
}

/* ===== كودك الأصلي ===== */
function f(n){return n.toLocaleString("en-US")+" IQD";}
function calc(){
  const base=(+a.value||0)*(+b.value||0)*1320;
  const tax=base*((+d.value||0)+(+e.value||0)+(+np.value||0))/100;
  rb.textContent=f(base);
  rt.textContent=f(tax);
  rf.textContent=f(base+tax);
  r.style.display="block";
}
function resetCalc(){
  r.style.display="none";
  a.value=b.value=d.value=e.value=np.value="";
  a.focus();
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
