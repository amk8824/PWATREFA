<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>الحاسبة الكمركية الذكية</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0f1c;
  --glass:rgba(255,255,255,0.06);
  --panel:#121a2a;
  --card:#182338;
  --primary:#22d39a;
  --accent:#f7d774;
  --text:#ffffff;
  --muted:#9aa6c3;
  --border:rgba(255,255,255,0.12);
}
*{box-sizing:border-box;font-family:'Cairo',sans-serif;}
html,body{
  margin:0;height:100%;
  background:radial-gradient(circle at top,#111a33,#070b14);
  overflow:hidden;color:var(--text);
}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
.app{height:100vh;display:flex;flex-direction:column;}
.hero{
  padding:22px 18px 18px;
  background:
    linear-gradient(135deg,rgba(34,211,154,0.25),transparent 40%),
    linear-gradient(225deg,rgba(247,215,116,0.18),transparent 45%);
  border-bottom:1px solid var(--border);
}
.hero-top{display:flex;align-items:center;justify-content:space-between;}
.hero img{height:46px;}
.hero-center{text-align:center;flex:1;}
.hero-center h1{margin:0;font-size:22px;font-weight:900;}
.hero-center p{margin:4px 0 0;font-size:12px;color:var(--muted);}
.designer-top{
  margin-top:12px;text-align:center;font-size:12px;color:var(--muted);
}
.designer-top strong{color:var(--primary);font-weight:900;}
.content{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px;}
.panel{
  background:var(--glass);
  backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-radius:24px;
  padding:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.input{
  background:linear-gradient(180deg,var(--card),#131c2e);
  border-radius:20px;padding:16px;
}
.input label{
  display:block;font-size:15px;font-weight:900;
  color:var(--accent);margin-bottom:10px;
}
.input input{
  width:100%;background:none;border:none;
  border-bottom:2px solid #2b3754;
  color:#fff;font-size:18px;padding:8px 0;
}
.input input[readonly]{
  border-bottom-style:dashed;color:var(--primary);font-weight:900;
}
.action{margin-top:auto;}
button.calc{
  width:100%;padding:20px;font-size:19px;font-weight:900;
  border:none;border-radius:24px;
  background:linear-gradient(135deg,var(--primary),#18bfa0);
  color:#062019;
}
.result{
  position:fixed;left:0;right:0;bottom:0;
  background:linear-gradient(160deg,#0f3f31,#07261e);
  padding:22px 18px 18px;display:none;z-index:20;
  border-top-left-radius:26px;border-top-right-radius:26px;
}
.result .close{
  position:absolute;top:10px;left:14px;
  background:none;border:none;color:#fff;
  font-size:24px;font-weight:900;
}
.result-row{
  display:flex;justify-content:space-between;
  font-size:17px;margin-bottom:8px;
}
.result h2{
  text-align:center;font-size:30px;
  color:var(--accent);margin-top:14px;
}
.recalc{margin-top:16px;}
.recalc button{
  width:100%;padding:16px;border:none;
  border-radius:20px;
  background:rgba(255,255,255,0.12);
  color:#fff;font-size:16px;font-weight:900;
}
</style>
</head>

<body>

<div class="app">
  <div class="hero">
    <div class="hero-top">
      <img src="https://www2.0zz0.com/2025/05/19/22/510831948.png">
      <div class="hero-center">
        <h1>الحاسبة الكمركية الذكية</h1>
        <p>جمهورية العراق – الهيئة العامة للكمارك</p>
      </div>
      <img src="https://www2.0zz0.com/2025/05/19/22/823371779.png">
    </div>
    <div class="designer-top">
      تم التصميم والبرمجة بواسطة
      <strong>احمد عبد القادر مشحن العبيدي</strong>
    </div>
  </div>

  <div class="content">
    <div class="panel">
      <div class="input"><label>سعر الطن</label><input id="a" type="number"></div>
      <div class="input"><label>عدد الأطنان</label><input id="b" type="number"></div>
      <div class="input"><label>سعر الصرف (مثبت)</label><input type="number" value="1320" readonly></div>
      <div class="input"><label>الضريبة الكمركية %</label><input id="d" type="number"></div>
      <div class="input"><label>الضريبة %</label><input id="e" type="number"></div>
    </div>
    <div class="action">
      <button class="calc" onclick="calc()">احتساب</button>
    </div>
  </div>
</div>

<div class="result" id="r">
  <button class="close" onclick="r.style.display='none'">×</button>
  <div class="result-row"><span>السعر الأساسي</span><span id="rb"></span></div>
  <div class="result-row"><span>إجمالي الضرائب</span><span id="rt"></span></div>
  <h2 id="rf"></h2>
  <div class="recalc"><button onclick="r.style.display='none'">إعادة احتساب</button></div>
</div>

<script>
function f(n){return n.toLocaleString("en-US")+" IQD";}
function calc(){
  const base=(+a.value||0)*(+b.value||0)*1320;
  const tax=base*((+d.value||0)+(+e.value||0))/100;
  rb.textContent=f(base);
  rt.textContent=f(tax);
  rf.textContent=f(base+tax);
  r.style.display="block";
}
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
