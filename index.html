<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الحاسبة الكمركية الذكية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">

<style>
/* ===== DESIGN SYSTEM ===== */
:root{
  --bg:#f2f4f6;
  --card:#ffffff;
  --primary:#0b5d3b;
  --secondary:#2fbf9b;
  --accent:#f3c969;
  --text:#1f2933;
  --muted:#6b7280;
  --border:#5f6368;
  --shadow:0 10px 30px rgba(0,0,0,.12);
}

/* الوضع الليلي */
body.dark{
  --bg:#0f1318;
  --card:#1b222c;
  --primary:#1f8f5f;
  --secondary:#35d6aa;
  --accent:#f3c969;
  --text:#ffffff;
  --muted:#9ca3af;
  --border:#9ca3af;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}

/* ===== GLOBAL ===== */
*{
  box-sizing:border-box;
  font-family:'Cairo',sans-serif;
  font-weight:800;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

/* ===== APP ===== */
.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== HEADER ===== */
.header{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  padding:18px;
  text-align:center;
  position:relative;
}
.header h1{
  margin:0;
  font-size:20px;
}
.header span{
  font-size:13px;
  opacity:.9;
}
.theme-btn{
  position:absolute;
  left:14px;
  top:14px;
  background:rgba(255,255,255,.2);
  border:none;
  color:#fff;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
}

/* ===== CONTENT ===== */
.content{
  flex:1;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

/* ===== CARD ===== */
.card{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  box-shadow:var(--shadow);
}

/* ===== GRID FORM ===== */
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

/* ===== FIELD ===== */
.field label{
  display:block;
  font-size:14px;
  color:var(--muted);
  margin-bottom:6px;
}

.field input{
  width:100%;
  padding:16px;
  border-radius:16px;
  border:2px solid var(--border);
  background:transparent;
  color:var(--text);
  font-size:17px;
}

.field input:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(11,93,59,.25);
}

/* ===== TOGGLE ===== */
.toggle{
  grid-column:1/3;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:15px;
}

/* ===== BUTTON ===== */
button.calc{
  grid-column:1/3;
  padding:18px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  font-size:18px;
  font-weight:900;
}

/* ===== RESULT ===== */
.result{
  background:linear-gradient(135deg,var(--primary),#063a25);
  color:#fff;
  border-radius:26px;
  padding:20px;
}
.result-row{
  display:flex;
  justify-content:space-between;
  font-size:16px;
  margin-bottom:10px;
}
.result h2{
  margin:12px 0 0;
  text-align:center;
  font-size:30px;
  color:var(--accent);
}

/* ===== DESIGNER ===== */
.designer{
  margin-top:25px;
  text-align:center;
  font-size:14px;
  color:var(--muted);
  line-height:1.8;
  padding-bottom:25px;
}
.designer strong{
  color:var(--primary);
}

.hidden{display:none}
</style>
</head>

<!-- 👇 الوضع الليلي افتراضي -->
<body class="dark">

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <button class="theme-btn" onclick="toggleTheme()">🌞</button>
    <h1>الحاسبة الكمركية الذكية</h1>
    <span>جمهورية العراق – الهيئة العامة للكمارك</span>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- FORM -->
    <div class="card">
      <div class="form-grid">

        <div class="field">
          <label>سعر الطن (USD)</label>
          <input id="pricePerTon" type="number" value="1000">
        </div>

        <div class="field">
          <label>عدد الأطنان</label>
          <input id="tons" type="number" value="1">
        </div>

        <div class="field">
          <label>سعر الصرف (IQD)</label>
          <input id="rate" type="number" value="1320">
        </div>

        <div class="field">
          <label>الضريبة الكمركية (%)</label>
          <input id="customTax" type="number" value="15">
        </div>

        <div class="field">
          <label>الضريبة (%)</label>
          <input id="generalTax" type="number" value="5">
        </div>

        <div class="field hidden" id="protectBox">
          <label>نسبة الحماية (%)</label>
          <input id="protectTax" type="number">
        </div>

        <div class="toggle">
          <input type="checkbox" id="protectToggle">
          <label>تفعيل رسم الحماية</label>
        </div>

        <button class="calc" onclick="calculate()">تنفيذ الحساب</button>

      </div>
    </div>

    <!-- RESULT -->
    <div class="result">
      <div class="result-row">
        <span>السعر الأساسي</span>
        <span id="baseOut">0</span>
      </div>
      <div class="result-row">
        <span>إجمالي الضرائب</span>
        <span id="taxOut">0</span>
      </div>
      <h2 id="totalOut">0 IQD</h2>
    </div>

    <!-- DESIGNER -->
    <div class="designer">
      تم تصميم وبرمجة البرنامج بواسطة:<br>
      <strong>احمد عبد القادر مشحن العبيدي</strong><br>
      Email: alobaidymo@gmail.com | Whatsapp: +9647768525871
    </div>

  </div>

</div>

<script>
const protectToggle = document.getElementById("protectToggle");
const protectBox = document.getElementById("protectBox");

protectToggle.onchange = ()=>{
  protectBox.classList.toggle("hidden", !protectToggle.checked);
};

function formatIQD(n){
  return n.toLocaleString("en-US")+" IQD";
}

function vibrate(){
  if(navigator.vibrate) navigator.vibrate(70);
}

function calculate(){
  vibrate();

  const price = +pricePerTon.value || 0;
  const tonsVal = +tons.value || 0;
  const rateVal = +rate.value || 0;
  const custom = +customTax.value || 0;
  const general = +generalTax.value || 0;
  const protect = protectToggle.checked ? (+protectTax.value || 0) : 0;

  const base = price * tonsVal * rateVal;
  const taxes = base * (custom + general + protect) / 100;
  const total = base + taxes;

  baseOut.innerText = formatIQD(base);
  taxOut.innerText = formatIQD(taxes);
  totalOut.innerText = formatIQD(total);
}

function toggleTheme(){
  document.body.classList.toggle("dark");
  document.querySelector(".theme-btn").textContent =
    document.body.classList.contains("dark") ? "🌞" : "🌙";
}
</script>

</body>
</html>
