<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الحاسبة الكمركية الذكية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    font-family:'Cairo', sans-serif;
}

body{
    margin:0;
    background:#f3f5f4;
    color:#222;
}

/* HEADER */
.header{
    background:#0b5d3b;
    padding:16px 24px;
    color:#fff;
    display:flex;
    justify-content:center;
    text-align:center;
}
.header h1{
    margin:0;
    font-size:18px;
    color:#f0c85a;
}
.header span{
    font-size:12px;
    opacity:.9;
}

/* LAYOUT */
.main{
    width:100%;
    max-width:1100px;
    margin:20px auto;
    display:grid;
    grid-template-columns:1fr 1.4fr;
    gap:20px;
    padding:0 16px;
}

/* CARD */
.card{
    background:#fff;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,.08);
    padding:20px;
}
.card h2{
    margin-top:0;
    font-size:17px;
    color:#0b5d3b;
    text-align:center;
}

/* FORM */
.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}
.field label{
    font-size:13px;
    margin-bottom:6px;
    display:block;
}
.field input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:14px;
}

/* TOGGLE */
.toggle{
    grid-column:1/3;
    background:#e9fff4;
    padding:12px;
    border-radius:10px;
    display:flex;
    gap:10px;
    align-items:center;
    font-size:13px;
}

/* BUTTON */
button{
    grid-column:1/3;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#0b5d3b;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

/* SUMMARY */
.summary-box{
    background:#0b5d3b;
    color:#fff;
    border-radius:12px;
    padding:20px;
    text-align:center;
    margin-bottom:15px;
}
.summary-box h3{
    margin:10px 0;
    font-size:24px;
}

.summary-list div{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px dashed #ddd;
    font-size:14px;
}

/* FOOTER */
.footer{
    text-align:center;
    font-size:12px;
    color:#555;
    margin:30px 0;
}

/* HIDDEN */
.hidden{display:none}

/* ======================
   MOBILE RESPONSIVE
   ====================== */
@media (max-width:768px){

    .header h1{
        font-size:16px;
    }

    .main{
        grid-template-columns:1fr;
        padding:0 12px;
    }

    .card{
        padding:16px;
    }

    .form{
        grid-template-columns:1fr;
    }

    .toggle, button{
        grid-column:1/2;
    }

    button{
        font-size:17px;
    }

    .summary-box h3{
        font-size:22px;
    }
}
</style>
</head>

<body>

<div class="header">
    <div>
        <h1>الحاسبة الكمركية الذكية</h1>
        <span>جمهورية العراق – الهيئة العامة للكمارك</span>
    </div>
</div>

<div class="main">

    <!-- SUMMARY -->
    <div class="card">
        <h2>ملخص الاحتساب النهائي</h2>
        <div class="summary-box">
            <small>المبلغ النهائي المستحق</small>
            <h3 id="totalOut">0 IQD</h3>
        </div>
        <div class="summary-list">
            <div><span>السعر الأساسي</span><span id="baseOut">0</span></div>
            <div><span>الضريبة الكمركية</span><span id="customOut">0</span></div>
            <div><span>الضريبة</span><span id="generalOut">0</span></div>
            <div><span>رسم الحماية</span><span id="protectOut">0</span></div>
        </div>
    </div>

    <!-- FORM -->
    <div class="card">
        <h2>بيانات التسعير الكمركي</h2>

        <div class="form">
            <div class="field">
                <label>سعر الوحدة / الطن (USD)</label>
                <input id="usdInput" type="number" value="1000">
            </div>

            <div class="field">
                <label>سعر الصرف (IQD)</label>
                <input id="rateInput" type="number" value="1320">
            </div>

            <div class="field">
                <label>الضريبة الكمركية (%)</label>
                <input id="customTaxInput" type="number" value="15">
            </div>

            <div class="field">
                <label>الضريبة (%)</label>
                <input id="generalTaxInput" type="number" value="5">
            </div>

            <div class="toggle">
                <input type="checkbox" id="protectToggle">
                <label>تفعيل رسم دعم المنتج الوطني (الحماية)</label>
            </div>

            <div class="field hidden" id="protectBox">
                <label>نسبة رسم الحماية (%)</label>
                <input id="protectInput" type="number">
            </div>

            <button onclick="calculate()">تنفيذ الحساب</button>
        </div>
    </div>

</div>

<div class="footer">
    تصميم وبرمجة: احمد عبد القادر العبيدي – 07768525817 – a.alobaidymo@gmail.com
</div>

<script>
const protectToggle=document.getElementById("protectToggle");
const protectBox=document.getElementById("protectBox");

protectToggle.onchange=()=>{
    protectBox.classList.toggle("hidden",!protectToggle.checked);
};

function f(n){return n.toLocaleString("en-US")+" IQD"}

function calculate(){
    const usd=+usdInput.value||0;
    const rate=+rateInput.value||0;
    const ct=+customTaxInput.value||0;
    const gt=+generalTaxInput.value||0;
    const pr=protectToggle.checked?(+protectInput.value||0):0;

    const base=usd*rate;
    const cv=base*ct/100;
    const gv=base*gt/100;
    const pv=base*pr/100;
    const total=base+cv+gv+pv;

    baseOut.innerText=f(base);
    customOut.innerText=f(cv);
    generalOut.innerText=f(gv);
    protectOut.innerText=f(pv);
    totalOut.innerText=f(total);
}
</script>

</body>
</html>
