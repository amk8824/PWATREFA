<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>الحاسبة الكمركية الذكية</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">

<meta name="theme-color" content="#06090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --bg:#0b0f14;
  --header:#06090d;
  --panel:#121823;
  --card:#1b2330;
  --primary:#1fd18b;
  --accent:#f5c86a;
  --text:#ffffff;
  --muted:#9aa3b2;
}

*{
  box-sizing:border-box;
  font-family:'Cairo',sans-serif;
}

html,body{
  margin:0;
  height:100%;
  background:var(--bg);
  overflow:hidden;
  color:var(--text);
}

/* إزالة أسهم الأرقام */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{
  -webkit-appearance:none;
}
input[type=number]{ -moz-appearance:textfield; }

/* APP */
.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  background:var(--header);
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.header img{height:52px;}
.header-center{
  flex:1;
  text-align:center;
}
.header-center h1{
  margin:0;
  font-size:20px;
  font-weight:900;
}
.header-center span{
  font-size:12px;
  color:var(--muted);
}

/* PANEL */
.panel{
  flex:1;
  background:var(--panel);
  padding:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

/* INPUT CARD */
.input{
  background:var(--card);
  border-radius:20px;
  padding:16px;
}
.input label{
  display:block;
  font-size:15px;
  font-weight:900;
  color:var(--accent);
  margin-bottom:10px;
}
.input input{
  width:100%;
  background:none;
  border:none;
  border-bottom:2px solid #2a3444;
  color:#fff;
  font-size:17px;
  padding:8px 0;
}
.input input[readonly]{
  border-bottom-style:dashed;
  color:var(--primary);
  font-weight:900;
}

/* ACTION */
.action{
  background:var(--header);
  padding:14px;
}
button{
  width:100%;
  padding:18px;
  font-size:18px;
  font-weight:900;
  border:none;
  border-radius:20px;
  background:linear-gradient(135deg,var(--primary),#18b87c);
  color:#062016;
}

/* RESULT */
.result{
  background:linear-gradient(160deg,#0e3f2a,#062718);
  padding:18px;
  display:none;
}
.result-row{
  display:flex;
  justify-content:space-between;
  font-size:16px;
  margin-bottom:6px;
}
.result h2{
  text-align:center;
  font-size:26px;
  color:var(--accent);
  margin-top:12px;
}

/* FOOTER (ثابت + مضمون) */
.footer{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  padding:10px 0;
}
.footer .designer-name{
  display:block;
  color:var(--primary);
  font-weight:900;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <img src="https://www2.0zz0.com/2025/05/19/22/510831948.png" alt="logo right">
    <div class="header-center">
      <h1>الحاسبة الكمركية الذكية</h1>
      <span>الهيئة العامة للكمارك</span>
    </div>
    <img src="https://www2.0zz0.com/2025/05/19/22/823371779.png" alt="logo left">
  </div>

  <!-- PANEL -->
  <div class="panel">
    <div class="input">
      <label>سعر الطن</label>
      <input id="a" type="number">
    </div>

    <div class="input">
      <label>عدد الأطنان</label>
      <input id="b" type="number">
    </div>

    <div class="input">
      <label>سعر الصرف (مثبت)</label>
      <input id="c" type="number" value="1320" readonly>
    </div>

    <div class="input">
      <label>الضريبة الكمركية %</label>
      <input id="d" type="number">
    </div>

    <div class="input">
      <label>الضريبة %</label>
      <input id="e" type="number">
    </div>
  </div>

  <!-- ACTION -->
  <div class="action">
    <button onclick="calc()">احسب الآن</button>
  </div>

  <!-- RESULT -->
  <div class="result" id="r">
    <div class="result-row">
      <span>السعر الأساسي</span>
      <span id="rb"></span>
    </div>
    <div class="result-row">
      <span>إجمالي الضرائب</span>
      <span id="rt"></span>
    </div>
    <h2 id="rf"></h2>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span>تم التصميم والبرمجة بواسطة</span>
    <span class="designer-name">احمد عبد القادر مشحن العبيدي</span>
  </div>

</div>

<script>
function f(n){
  return n.toLocaleString("en-US")+" IQD";
}

function calc(){
  if(navigator.vibrate) navigator.vibrate(70);

  const base=(+a.value||0)*(+b.value||0)*1320;
  const tax=base*((+d.value||0)+(+e.value||0))/100;

  r.style.display="block";
  rb.textContent=f(base);
  rt.textContent=f(tax);
  rf.textContent=f(base+tax);
}
</script>

</body>
</html>
